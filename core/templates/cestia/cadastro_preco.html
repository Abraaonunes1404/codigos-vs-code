<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Preços - Painel Lojista</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #F8F9FA; display: flex; justify-content: center; }
        .celular-container { width: 100%; max-width: 410px; min-height: 100vh; background-color: #FFF; box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative; padding: 20px; padding-bottom: 40px; }
        .topo-lojista { background-color: #1A237E; padding: 25px 20px; margin: -20px -20px 25px -20px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; color: #FFF; }
        .titulo-painel { font-size: 20px; font-weight: bold; }
        .sub-painel { font-size: 12px; color: #9FA8DA; margin-top: 2px; }
        .campo-grupo { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
        .rotulo { font-size: 13px; font-weight: 700; color: #3F51B5; }
        .input-select, .input-text { width: 100%; height: 46px; border: 1px solid #C5CAE9; border-radius: 12px; padding: 0 12px; font-size: 14px; outline: none; background-color: #FAFAFA; color: #333; }
        .input-select:focus, .input-text:focus { border: 2px solid #3F51B5; background-color: #FFF; }
        .btn-salvar { width: 100%; height: 50px; background-color: #3F51B5; color: #FFF; border: none; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 12px rgba(63,81,181,0.2); }
        .btn-voltar { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: #666; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="celular-container">
        <div class="topo-lojista">
            <div class="titulo-painel">🏪 Cestia Lojista</div>
            <div class="sub-painel">Atualização Rápida de Preços de Prateleira</div>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div style="background-color: #E8F5E9; border-left: 4px solid #2E7D32; color: #1B5E20; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 13px; font-weight: 600;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form action="/gerente-precos/salvar/" method="POST">
            {% csrf_token %}
            
            <div class="campo-grupo">
                <label class="rotulo">1. Selecione a Filial / Loja</label>
                <select name="filial" class="input-select" required>
                    {% for f in filiais %}
                        <option value="{{ f.id }}">{{ f.supermercado.nome }} - {{ f.nome_loja }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo-grupo">
                <label class="rotulo">2. Selecione o Produto</label>
                <select name="produto" class="input-select" required>
                    {% for p in produtos %}
                        <option value="{{ p.id }}">{{ p.nome }} ({{ p.marca }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo-grupo">
                <label class="rotulo">3. Novo Preço de Venda (R$)</label>
                <input type="text" name="preco" class="input-text" placeholder="Ex: 25.90" required autocomplete="off">
            </div>

            <button type="submit" class="btn-salvar">💾 Salvar Novo Preço</button>
        </form>

        <a href="/" class="btn-voltar">← Voltar para o Cestia</a>
    </div>
</body>
</html>
