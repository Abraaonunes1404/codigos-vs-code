<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Inteligente - Cestia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121212; display: flex; justify-content: center; color: #FFF; }
        .celular-container { width: 100%; max-width: 410px; min-height: 100vh; background-color: #1A1A1A; position: relative; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        
        .topo-scanner { text-align: center; margin-top: 10px; }
        .titulo-scanner { font-size: 18px; font-weight: bold; color: #FF6D00; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .sub-scanner { font-size: 11px; color: #AAA; margin-top: 4px; }

        /* AREA VISOR DA CAMERA REAL */
        .visor-camera { width: 100%; height: 320px; background-color: #000; border-radius: 25px; margin: 25px 0; border: 3px solid #FF6D00; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 0 25px rgba(255,109,0,0.15); }
        
        /* O container onde o Quagga injetará o vídeo ao vivo */
        #interactive.viewport { width: 100%; height: 100%; position: absolute; }
        #interactive.viewport video { width: 100%; height: 100%; object-fit: cover; }
        canvas.drawingBuffer { display: none; } /* Esconde marcações internas de debug */
        
        .linha-scanner { width: 85%; height: 2px; background-color: #00E5FF; position: absolute; z-index: 10; animation: escaneando 2.5s infinite linear; box-shadow: 0 0 10px #00E5FF; }
        
        @keyframes escaneando {
            0% { top: 15%; }
            50% { top: 85%; }
            100% { top: 15%; }
        }

        /* BOTOES DE CONTROLE */
        .controle-container { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-bottom: 20px; z-index: 10; }
        .btn-foto-produto { width: 100%; height: 52px; background: linear-gradient(135deg, #FF6D00, #FF9100); color: #FFF; border: none; border-radius: 26px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(255,109,0,0.3); text-align: center; line-height: 52px; }
        .btn-voltar { text-align: center; font-size: 13px; color: #AAA; text-decoration: none; font-weight: 600; margin-top: 5px; }
    </style>
    <!-- IMPORTAÇÃO DA BIBLIOTECA DE SCANNER AUTOMÁTICO (QUAGGA JS) -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div class="celular-container">
        <div class="topo-scanner">
            <div class="titulo-scanner">🤖 Scanner IA Cestia</div>
            <div class="sub-scanner">Mire o codigo de barras para ler automatico ou tire foto do preço</div>
        </div>

        <!-- Visor de vídeo integrado com detecção de barras automática -->
        <div class="visor-camera">
            <div class="linha-scanner"></div>
            <div id="interactive" class="viewport"></div>
        </div>

        <div class="controle-container">
            <!-- SUA REGRA DE SEGURANÇA: Abre apenas a câmera nativa para registrar a etiqueta de preço -->
            <label for="camera-captura" class="btn-foto-produto">
                📸 Foto do Produto e Preço
            </label>
            <form id="form-ia-visao" action="/api/scan/" method="POST" enctype="multipart/form-data" style="display: none;">
                {% csrf_token %}
                <input type="file" id="camera-captura" name="imagem_gondola" accept="image/*" capture="environment" onchange="document.getElementById('form-ia-visao').submit();">
            </form>
            
            <a href="/cesta/" class="btn-voltar">← Voltar para a Cesta</a>
        </div>
    </div>

    <!-- SCRIPT DE INTELIGÊNCIA DE DETECÇÃO EM TEMPO REAL -->
    <script>
        function iniciarScannerAutomatico() {
            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector('#interactive'), // Joga o vídeo no visor
                    constraints: {
                        width: 640,
                        height: 480,
                        facingMode: "environment" // Força o uso da câmera traseira
                    },
                },
                decoder: {
                    readers: ["ean_reader", "ean_8_reader"] // Foco: Códigos de barras de supermercado
                }
            }, function(err) {
                if (err) {
                    console.log("Erro ao iniciar o Quagga, tentando alternativa de câmera simples...", err);
                    return;
                }
                console.log("Motor de leitura automática inicializado com sucesso!");
                Quagga.start(); // Dá o play na câmera e na análise de vídeo
            });

            // GATILHO DE SUCESSO: Executado automaticamente assim que descobre um código de barras válido
            Quagga.onDetected(function(resultado) {
                const codigoEAN = resultado.codeResult.code;
                if (codigoEAN) {
                    Quagga.stop(); // Trava a câmera para não ler o mesmo item duas vezes seguidas
                    
                    // Emite um bipe visual e envia o código capturado direto para o Python no backend!
                    alert("║▌║ Código Detectado Automaticamente: " + codigoEAN);
                    window.location.href = "/api/scan/?ean=" + codigoEAN;
                }
            });
        }

        // Inicializa o olho digital assim que a interface carregar na tela
        window.addEventListener('DOMContentLoaded', iniciarScannerAutomatico);
    </script>

</body>
</html>
