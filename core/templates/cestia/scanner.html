<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Inteligente - Cestia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121212; display: flex; justify-content: center; color: #FFF; }
        .celular-container { width: 100%; max-width: 410px; min-height: 100vh; background-color: #1A1A1A; position: relative; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        
        .topo-scanner { text-align: center; margin-top: 20px; }
        .titulo-scanner { font-size: 18px; font-weight: bold; color: #FF6D00; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .sub-scanner { font-size: 11px; color: #AAA; margin-top: 4px; }

        /* AREA VISOR DA CAMERA REAL AO VIVO */
        .visor-camera { width: 100%; height: 320px; background-color: #000; border-radius: 25px; margin: 25px 0; border: 3px solid #FF6D00; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 0 25px rgba(255,109,0,0.15); }
        
        /* Tag de video nativa que recebe o sinal da lente do celular */
        #video-ao-vivo { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        
        .linha-scanner { width: 85%; height: 2px; background-color: #00E5FF; position: absolute; z-index: 10; animation: escaneando 2.5s infinite linear; box-shadow: 0 0 10px #00E5FF; }
        
        @keyframes escaneando {
            0% { top: 15%; }
            50% { top: 85%; }
            100% { top: 15%; }
        }

        /* BOTOES DE CONTROLE */
        .controle-container { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-bottom: 20px; z-index: 10; }
        .btn-foto-produto { width: 100%; height: 52px; background: linear-gradient(135deg, #FF6D00, #FF9100); color: #FFF; border: none; border-radius: 26px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(255,109,0,0.3); text-align: center; line-height: 52px; }
        .btn-voltar { text-align: center; font-size: 13px; color: #AAA; text-decoration: none; font-weight: 600; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="celular-container">
        <div class="topo-scanner">
            <div class="titulo-scanner">🤖 Scanner IA Cestia</div>
            <div class="sub-scanner">A camera ja esta ativa! Posicione o produto ou capture o preco</div>
        </div>

        <!-- Visor com a Tag de Vídeo Nativa para carregar a imagem na hora -->
        <div class="visor-camera">
            <div class="linha-scanner"></div>
            <!-- Elemento de video fixado esperando a transmissao -->
            <video id="video-ao-vivo" autoplay playsinline muted></video>
        </div>

        <div class="controle-container">
            <!-- TRAVA DE SEGURANÇA: Abre a camera nativa em tela cheia para garantir a foto real da etiqueta -->
            <label for="camera-captura" class="btn-foto-produto" style="cursor: pointer;">
                📸 Capturar Preco por IA
            </label>
            <form id="form-ia-visao" action="/api/scan/" method="POST" enctype="multipart/form-data" style="display: none;">
                {% csrf_token %}
                <input type="file" id="camera-captura" name="imagem_gondola" accept="image/*" capture="environment" onchange="document.getElementById('form-ia-visao').submit();">
            </form>
            
            <a href="/cesta/" class="btn-voltar">← Voltar para a Cesta</a>
        </div>
    </div>

    <!-- SCRIPT DE ACENDIMENTO IMEDIATO DE VIDEO -->
    <script>
        async function forçarAberturaCamera() {
            const elementoVideo = document.getElementById('video-ao-vivo');
            
            // Tenta abrir diretamente a câmera de trás do smartphone
            try {
                const streamTraseira = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                elementoVideo.srcObject = streamTraseira;
                console.log("Câmera traseira de gôndola ativada com sucesso!");
            } catch (erroTraseira) {
                console.log("Ambiente sem câmera traseira rígida (PC), tentando webcam...");
                // Fallback seguro: se estiver rodando no PC do Tarumã, abre a webcam padrão de primeira
                try {
                    const streamPadrao = await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: false
                    });
                    elementoVideo.srcObject = streamPadrao;
                } catch (erroGrave) {
                    console.log("Nenhuma permissão de hardware concedida pelo navegador.", erroGrave);
                }
            }
        }

        // Inicializa o olho digital no instante exato em que a página abre na tela
        window.addEventListener('DOMContentLoaded', forçarAberturaCamera);
    </script>

</body>
</html>
