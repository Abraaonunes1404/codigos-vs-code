<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Inteligente - Cestia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121212; display: flex; justify-content: center; color: #FFF; }
        .celular-container { width: 100%; max-width: 410px; min-height: 100vh; background-color: #1A1A1A; position: relative; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        
        .topo-scanner { text-align: center; margin-top: 10px; }
        .titulo-scanner { font-size: 18px; font-weight: bold; color: #FF6D00; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .sub-scanner { font-size: 11px; color: #AAA; margin-top: 4px; }

        /* AREA VISOR DA CAMERA */
        .visor-camera { width: 100%; height: 320px; background-color: #000; border-radius: 25px; margin: 25px 0; border: 3px solid #FF6D00; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 0 25px rgba(255,109,0,0.15); }
        .linha-scanner { width: 85%; height: 2px; background-color: #00E5FF; position: absolute; animation: escaneando 2.5s infinite linear; box-shadow: 0 0 10px #00E5FF; }
        
        @keyframes escaneando {
            0% { top: 15%; }
            50% { top: 85%; }
            100% { top: 15%; }
        }

        /* BOTOES DE CONTROLE */
        .controle-container { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-bottom: 20px; }
        
        /* O Botao solicitado por você */
        .btn-foto-produto { width: 100%; height: 52px; background: linear-gradient(135deg, #FF6D00, #FF9100); color: #FFF; border: none; border-radius: 26px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(255,109,0,0.3); }
        
        .btn-simular-barra { width: 100%; height: 46px; background-color: #263238; color: #ECEFF1; border: 1px solid #37474F; border-radius: 23px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-voltar { text-align: center; font-size: 13px; color: #AAA; text-decoration: none; font-weight: 600; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="celular-container">
        <div class="topo-scanner">
            <div class="titulo-scanner">🤖 Scanner IA Cestia</div>
            <div class="sub-scanner">Aponte para o codigo de barras ou para o preco na prateleira</div>
        </div>

        <!-- Interface do Visor com a Linha de IA Varrendo -->
        <div class="visor-camera">
            <div class="linha-scanner"></div>
            <span style="font-size: 40px; opacity: 0.3; color: #FFF;">📷</span>
            <p style="font-size: 11px; color: #666; margin-top: 10px; font-weight: 600;">Modo Hibrido: IA + EAN Ativos</p>
        </div>
        <div class="class-controle-container" style="display: flex; flex-direction: column; gap: 12px; width: 100%; margin-bottom: 20px;">
                <div class="class-controle-container" style="display: flex; flex-direction: column; gap: 12px; width: 100%; margin-bottom: 20px;">
            <!-- SEU BOTAO SOLICITADO: Foto do Produto conectada com a IA -->
            <button class="btn-foto-produto" onclick="location.href='/api/scan/?foto_produto=true'" style="width: 100%; height: 52px; background: linear-gradient(135deg, #FF6D00, #FF9100); color: #FFF; border: none; border-radius: 26px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(255,109,0,0.3);">
                📸 Foto do Produto
            </button>

            <!-- Botao para ler o codigo de barras tradicional -->
            <button class="btn-simular-barra" onclick="location.href='/api/scan/?ean=7891000100101'" style="width: 100%; height: 46px; background-color: #263238; color: #ECEFF1; border: 1px solid #37474F; border-radius: 23px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
                ║▌║ Leitor de Barras Rápido
            </button>
            
            <a href="/cesta/" class="btn-voltar" style="text-align: center; font-size: 13px; color: #AAA; text-decoration: none; font-weight: 600; margin-top: 5px;">← Voltar para a Cesta</a>
        </div>



</body>
</html>
